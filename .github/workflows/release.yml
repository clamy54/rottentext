# Release: push d'un tag v* -> build 3 OS -> release GitHub en draft.
# Les scripts du depot font tout le travail, ici on orchestre seulement.
# Repetition a blanc: Actions > release > Run workflow (artefacts, pas de release).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# un seul run par ref; pas d'annulation en vol (release a moitie faite sinon)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # garde-fou: tag coherent avec RT_VERSION avant de bruler des minutes de build
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extraire RT_VERSION et controler le tag
        id: ver
        run: |
          ver="$(sed -n "s/.*RT_VERSION = '\([^']*\)'.*/\1/p" src/uMain.pas | head -1)"
          [ -n "$ver" ] || { echo "RT_VERSION introuvable dans src/uMain.pas" >&2; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "tag $GITHUB_REF_NAME != v$ver (RT_VERSION): version pas montee ou tag mal nomme" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: guard
    # arm64. Pas macos-latest: l'image macos-26 refuse le mpkg FPC (format
    # bundle). macos-14 = Xcode 15.4, le toolchain valide en local; son ld
    # moderne casse sur les sections objc de FPC (meme en 3.2.4rc1), le
    # .lpi force -ld_classic sur darwin.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache des installeurs FPC et Lazarus
        uses: actions/cache@v4
        with:
          path: ~/laz-dl
          key: laz-macos-aarch64-4.8-fpc-3.2.4rc1a
      - name: Installer Lazarus 4.8 aarch64
        # pas setup-lazarus ici: sur macOS il ne pose que la variante x86_64
        # (l'app sortirait en Intel/Rosetta) et s'arrete a 4.4. On installe
        # la distribution aarch64 officielle 4.8, celle testee en local.
        # SourceForge bride le debit au point de faire sauter le timeout du
        # job: on sert d'abord le miroir GitHub (release du depot
        # clamy54/lazarus-macos-mirror, memes fichiers), SourceForge n'est
        # plus que le secours. Le cache d'actions ci-dessus evite meme ce
        # premier telechargement d'un run au suivant.
        run: |
          mirror="https://github.com/clamy54/lazarus-macos-mirror/releases/download/lazarus-4.8-aarch64"
          sf="https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%204.8"
          dl="$HOME/laz-dl"; mkdir -p "$dl"
          fetch() {  # $1 nom du fichier; garde la copie du cache si elle est la
            [ -s "$dl/$1" ] && { echo "$1: depuis le cache"; return 0; }
            curl -fsSL --retry 3 -o "$dl/$1" "$mirror/$1" && { echo "$1: depuis le miroir GitHub"; return 0; }
            echo "$1: miroir indisponible, repli SourceForge" >&2
            curl -fsSL --retry 3 -o "$dl/$1" "$sf/$1/download"
          }
          fetch fpc-3.2.4rc1a.intelarm64-macosx.dmg
          fetch lazarus-darwin-aarch64-4.8.zip
          sudo hdiutil attach -noautoopen "$dl/fpc-3.2.4rc1a.intelarm64-macosx.dmg"
          # le dmg 3.2.4rc1a monte en fpc-3.2.4rc1...-flat: glob sur fpc-*
          pkg="$(find /Volumes/fpc-* -maxdepth 1 \( -name '*.mpkg' -o -name '*.pkg' \) | head -1)"
          [ -n "$pkg" ] || { echo "paquet FPC introuvable dans le dmg" >&2; ls /Volumes >&2; exit 1; }
          sudo installer -package "$pkg" -target /
          sudo hdiutil detach /Volumes/fpc-*
          unzip -q "$dl/lazarus-darwin-aarch64-4.8.zip" -d "$HOME/laz"
          # la config portable du zip pointe /Developer/lazarus, inaccessible
          # (racine scellee SSV): on la fait pointer sur l'emplacement reel
          cfg="$HOME/laz/lazarus/config/environmentoptions.xml"
          [ -f "$cfg" ] || { echo "config du zip introuvable" >&2; ls "$HOME/laz" "$HOME/laz/lazarus" >&2; exit 1; }
          sed -i '' "s|/Developer/lazarus|$HOME/laz/lazarus|g" "$cfg"
          lb="$HOME/laz/lazarus/lazbuild"
          [ -x "$lb" ] || { echo "lazbuild introuvable dans le zip" >&2; exit 1; }
          sudo ln -sf "$lb" /usr/local/bin/lazbuild
          lazbuild --version
          # SynEdit rate les avances fractionnaires (CoreText): texte corrompu
          # au deplacement du curseur avec Monaspace, voir le script
          bash scripts/patch-synedit-fractional.sh "$HOME/laz/lazarus"
      - name: Construire RottenText.app (release, signature ad hoc)
        run: bash scripts/make-app.sh --release
      - name: Empaqueter le .dmg
        # sans permission TCC le Finder ne repond pas: le script expire au bout
        # de 30 s et livre un .dmg non style, prevu et pas bloquant
        run: bash dist/macos/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/macos/build/RottenText-*.dmg
          if-no-files-found: error

  build-linux:
    needs: guard
    runs-on: ubuntu-latest  # amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache des paquets FPC et Lazarus
        uses: actions/cache@v4
        with:
          path: ~/laz-dl
          key: laz-linux-amd64-4.8-fpc-3.2.2
      - name: Installer Lazarus 4.8
        # plus setup-lazarus: il s'arrete a 4.4 et tire tout de SourceForge,
        # qui bride les runners GitHub jusqu'au timeout. Les .deb officiels
        # 4.8 viennent du miroir clamy54/lazarus-mirror, SourceForge en secours.
        run: |
          mirror="https://github.com/clamy54/lazarus-mirror/releases/download/lazarus-4.8-linux-amd64"
          sf="https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8"
          dl="$HOME/laz-dl"; mkdir -p "$dl"
          fetch() {
            [ -s "$dl/$1" ] && { echo "$1: depuis le cache"; return 0; }
            curl -fsSL --retry 3 -o "$dl/$1" "$mirror/$1" && { echo "$1: depuis le miroir GitHub"; return 0; }
            echo "$1: miroir indisponible, repli SourceForge" >&2
            curl -fsSL --retry 3 -o "$dl/$1" "$sf/$1/download"
          }
          fetch fpc-laz_3.2.2-210709_amd64.deb
          fetch fpc-src_3.2.2-210709_amd64.deb
          fetch lazarus-project_4.8.0-0_amd64.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$dl/fpc-laz_3.2.2-210709_amd64.deb" \
            "$dl/fpc-src_3.2.2-210709_amd64.deb" \
            "$dl/lazarus-project_4.8.0-0_amd64.deb"
          lazbuild --version
      - name: Dependances d'empaquetage
        # dpkg-shlibdeps (dpkg-dev) pour les Depends, imagemagick pour les icones
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev imagemagick
      - name: Compiler (release)
        run: bash scripts/build.sh --release
      - name: Empaqueter le .deb
        run: bash dist/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/linux/build/rottentext_*_amd64.deb
          if-no-files-found: error

  build-windows:
    needs: guard
    runs-on: windows-latest  # x64
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cache de l'installeur Lazarus
        uses: actions/cache@v4
        with:
          path: ~/laz-dl
          key: laz-win64-4.8-fpc-3.2.2
      - name: Installer Lazarus 4.8
        # plus setup-lazarus: il s'arrete a 4.4 et tire tout de SourceForge,
        # qui bride les runners GitHub jusqu'au timeout. L'installeur officiel
        # 4.8 vient du miroir clamy54/lazarus-mirror, SourceForge en secours.
        # Install silencieuse dans C:\lazarus, un des chemins que build.ps1 sonde.
        run: |
          $name = "lazarus-4.8-fpc-3.2.2-win64.exe"
          $mirror = "https://github.com/clamy54/lazarus-mirror/releases/download/lazarus-4.8-win64/$name"
          $sf = "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/$name/download"
          $dl = Join-Path $HOME "laz-dl"; New-Item -ItemType Directory -Force $dl | Out-Null
          $exe = Join-Path $dl $name
          if ((Test-Path $exe) -and (Get-Item $exe).Length -gt 0) {
            Write-Output "${name}: depuis le cache"
          } else {
            try { curl.exe -fsSL --retry 3 -o $exe $mirror; if ($LASTEXITCODE -ne 0) { throw "miroir" }; Write-Output "${name}: depuis le miroir GitHub" }
            catch { Write-Warning "${name}: miroir indisponible, repli SourceForge"; curl.exe -fsSL --retry 3 -o $exe $sf; if ($LASTEXITCODE -ne 0) { throw "telechargement impossible" } }
          }
          Start-Process -Wait -FilePath $exe -ArgumentList '/VERYSILENT','/NORESTART','/SP-','/SUPPRESSMSGBOXES','/DIR=C:\lazarus'
          if (-not (Test-Path 'C:\lazarus\lazbuild.exe')) { throw "lazbuild.exe absent apres installation" }
          & 'C:\lazarus\lazbuild.exe' --version
      - name: Verifier Inno Setup 6
        # preinstalle sur windows-latest, ceinture et bretelles si l'image change
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Compiler (release)
        run: ./scripts/build.ps1 -Release
      - name: Compiler l'installeur
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" dist\windows\rottentext.iss
      - name: Zipper l'installeur
        run: |
          $setup = Get-ChildItem dist\windows\output\RottenText-Setup-*.exe | Select-Object -First 1
          Compress-Archive -Path $setup.FullName -DestinationPath ($setup.FullName -replace '\.exe$', '.zip') -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/windows/output/RottenText-Setup-*.zip
          if-no-files-found: error

  release:
    # publication seulement sur push de tag; un dispatch reste une repetition a blanc
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [guard, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VER: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Creer la release (draft) avec les 3 fichiers
        run: |
          ls -l assets
          notes="$(printf '%s\n\n%s' \
            "macOS: the app is ad-hoc signed, not notarized. Gatekeeper blocks the first launch: open the app once, then go to System Settings > Privacy & Security and click Open Anyway." \
            "Changes: https://github.com/${GH_REPO}/commits/${TAG}")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # relance apres echec: la release existe deja, on remplace les fichiers
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --draft --title "RottenText $VER" --notes "$notes"
          fi
